name: Deploy to ECS

on:
    push:
        branches: [main]
    workflow_dispatch:

jobs:
    build-and-push:
        runs-on: ubuntu-24.04
        steps:
            - name: 检出代码
              uses: actions/checkout@v5

            - name: 登录阿里云 ACR
              uses: docker/login-action@v3
              with:
                  registry: ${{ secrets.ACR_REGISTRY }}
                  username: ${{ secrets.ACR_USERNAME }}
                  password: ${{ secrets.ACR_PASSWORD }}

            - name: 构建并推送镜像
              uses: docker/build-push-action@v6
              with:
                  context: .
                  file: src/DevHabit.Api/Dockerfile
                  push: true
                  tags: |
                      ${{ secrets.ACR_REGISTRY }}/${{ secrets.ACR_NAMESPACE }}/${{ secrets.ACR_REPO }}:latest
                      ${{ secrets.ACR_REGISTRY }}/${{ secrets.ACR_NAMESPACE }}/${{ secrets.ACR_REPO }}:${{ github.sha }}

    deploy:
        needs: build-and-push
        runs-on: ubuntu-24.04
        steps:
            - name: SSH 到 ECS 拉取并重启容器
              uses: appleboy/ssh-action@v1.0.0
              with:
                  host: ${{ secrets.SERVER_HOST }}
                  username: ${{ secrets.SERVER_USER }}
                  key: ${{ secrets.SSH_PRIVATE_KEY }}
                  script: |
                      echo "${{ secrets.ACR_PASSWORD }}" | docker login \
                        ${{ secrets.ACR_REGISTRY }} \
                        -u ${{ secrets.ACR_USERNAME }} --password-stdin

                      docker pull ${{ secrets.ACR_REGISTRY }}/${{ secrets.ACR_NAMESPACE }}/${{ secrets.ACR_REPO }}:latest

                      docker stop devhabit || true
                      docker rm devhabit || true

                      docker run -d \
                        --name devhabit \
                        --restart unless-stopped \
                        -p 8080:8080 \
                        -e ASPNETCORE_ENVIRONMENT=Production \
                        -e ASPNETCORE_URLS=http://+:8080 \
                        ${{ secrets.ACR_REGISTRY }}/${{ secrets.ACR_NAMESPACE }}/${{ secrets.ACR_REPO }}:latest
